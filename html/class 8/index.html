<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Forms</h2>

    <form action="./home.html">
      <label for="user-name">User Name</label>
      <input required type="text" name="user-name" size="50" 
      placeholder="Enter User Name" /><br /><br />

      <label for="Password">Password</label>
      <input name="Password" type="text" maxlength="10" minlength="5" /> <br />
      <br />

      <label for="Contact">Contact</label>
      <input type="number" size="50" name="Contact" /> <br />

      <!-- <textarea name="desc" id="desc" cols="50" rows="10"></textarea> <br> -->
      <label for="">Gender :</label> <br />
      <label for="">Male</label>
      <input type="radio" name="gender" value="male" checked />
      <label for="">Female</label>
      <input type="radio" name="gender" value="female" />
      <label for="">Other</label>

      <input type="radio" name="gender" value="other" /> <br />

      <label for="">select course :</label><br />
      <label for="">Html</label>
      <input type="checkbox" name="course" value="html" placeholder="html" checked />
      <label for="">Css</label>
      <input type="checkbox" name="course" value="css" />
      <label for="">Js</label>
      <input type="checkbox" name="course" value="js" />

      <!-- <input type="submit"> -->
    </form>
  </body>
</html>
