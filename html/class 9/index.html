<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Forms</h2>

    <form action="./home.html">
      <label for="user-name">User Name</label>
      <input
        required
        type="text"
        name="user-name"
        size="50"
        placeholder="Enter User Name"
      /><br /><br />

      <label for="Password">Password</label>
      <input name="Password" type="text" maxlength="10" minlength="5" /> <br />
      <br />

      <label for="Contact">Contact</label>
      <input type="number" size="50" name="Contact" /> <br />

      <!-- <textarea name="desc" id="desc" cols="50" rows="10"></textarea> <br> -->
      <label for="">Gender :</label> <br />
      <label for="">Male</label>
      <input type="radio" name="gender" value="male" checked />
      <label for="">Female</label>
      <input type="radio" name="gender" value="female" />
      <label for="">Other</label>

      <input type="radio" name="gender" value="other" /> <br />

      <label for="">select course :</label><br />
      <label for="">Html</label>
      <input
        type="checkbox"
        name="course"
        value="html"
        placeholder="html"
        checked
      />
      <label for="">Css</label>
      <input type="checkbox" name="course" value="css" />
      <label for="">Js</label>
      <input type="checkbox" name="course" value="js" /> <br />

      <!-- <input type="submit"> -->

      <select name="" id="" size="" multiple>
        <option value="Pakistsan">Pakistan</option>
        <option value="China">China</option>
        <option value="Iran">Iran</option>
      </select>
      <br />
      <br />
      <br />

      <input type="hidden" /> <br /><br /><br />

      <!-- <input type="image" src="./image/sub-btn.jpg" width="100px"> -->

      <button>
        <img src="./image/sub-btn.jpg" width="100px" height="30px" alt="" />
      </button>
      <br /><br /><br />

      <label>Age: <input type="text" name="age" /></label> <br />

      Gender:
      <input id="female" type="radio" name="gender" value="f" />
      <label for="male">Female</label>
      <input id="male" type="radio" name="gender" value="m" />
      <label for="female">Male</label>
    </form>

    <fieldset>
      <legend >Contact details</legend>
      <label
        >Email:<br />
        <input type="text" name="email" /></label
      ><br />
      <label
        >Mobile:<br />
        <input type="text" name="mobile" /></label
      ><br />
      <label
        >Telephone:<br />
        <input type="text" name="telephone"
      /></label>
    </fieldset>

    <br><br>

    <input type="date" id="abc" class="abc">
    <input type="text" id="xyz" class="abc">

  </body>
</html>
